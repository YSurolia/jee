<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Lens Camera</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="mode-photo">

    <!-- Top bar -->
    <header class="topbar">
      <button class="icon-btn" id="btnSettings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.43-2.53a7.8 7.8 0 0 0 0-1.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.68-.97l-.36-2.54A.5.5 0 0 0 14.13 2h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.6.24-1.17.57-1.68.97l-2.39-.96a.5.5 0 0 0-.6.22L2.84 8.51a.5.5 0 0 0 .12.64l2.03 1.58a7.8 7.8 0 0 0 0 1.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.51.4 1.08.73 1.68.97l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.6-.24 1.17-.57 1.68-.97l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58Z"/></svg>
      </button>
      <button class="icon-btn" id="btnFlash" aria-label="Flash">
        <svg viewBox="0 0 24 24"><path id="flashPath" d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
        <span class="badge" id="flashBadge">OFF</span>
      </button>
      <button class="icon-btn" id="btnTimer" aria-label="Self timer">
        <svg viewBox="0 0 24 24"><path d="M15 1H9v2h6V1Zm-4 13h2V8h-2v6Zm8.03-6.61 1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42A8.96 8.96 0 0 0 12 4a9 9 0 1 0 9 9c0-2.12-.74-4.07-1.97-5.61ZM12 20a7 7 0 1 1 0-14 7 7 0 0 1 0 14Z"/></svg>
        <span class="badge" id="timerBadge">OFF</span>
      </button>
      <button class="icon-btn" id="btnGrid" aria-label="Grid lines">
        <svg viewBox="0 0 24 24"><path d="M3 3v18h18V3H3Zm6 16H5v-4h4v4Zm0-6H5V9h4v4Zm0-6H5V5h4v2Zm6 12h-4v-4h4v4Zm0-6h-4V9h4v4Zm0-6h-4V5h4v2Zm4 12h-4v-4h4v4Zm0-6h-4V9h4v4Zm0-6h-4V5h4v2Z"/></svg>
      </button>
      <button class="icon-btn" id="btnLens" aria-label="Choose lens">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm0-13a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0 8a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/></svg>
        <span class="badge" id="lensBadge">1</span>
      </button>
    </header>

    <!-- Viewfinder -->
    <main class="stage" id="stage">
      <div class="viewfinder" id="viewfinder">
        <video id="video" playsinline muted autoplay></video>
        <div class="grid-overlay" id="gridOverlay"><i></i><i></i><i></i><i></i></div>
        <div class="focus-ring" id="focusRing"></div>
        <div class="exposure" id="exposure">
          <svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10ZM2 13h2a1 1 0 0 0 0-2H2a1 1 0 0 0 0 2Zm18 0h2a1 1 0 0 0 0-2h-2a1 1 0 0 0 0 2ZM11 2v2a1 1 0 0 0 2 0V2a1 1 0 0 0-2 0Zm0 18v2a1 1 0 0 0 2 0v-2a1 1 0 0 0-2 0Z"/></svg>
          <input type="range" id="exposureRange" aria-label="Exposure">
        </div>
        <div class="rec-pill" id="recPill"><span class="dot"></span><span id="recTime">00:00</span></div>
        <div class="countdown" id="countdown"></div>
        <div class="shutter-flash" id="shutterFlash"></div>
      </div>

      <div class="zoom-wrap" id="zoomWrap">
        <div class="zoom-slider" id="zoomSlider">
          <input type="range" id="zoomRange" min="1" max="10" step="0.01" value="1" aria-label="Zoom">
        </div>
        <div class="zoom-pills" id="zoomPills"></div>
      </div>
    </main>

    <!-- Bottom controls -->
    <footer class="controls">
      <div class="modes" id="modes">
        <button data-mode="photo" class="active">PHOTO</button>
        <button data-mode="video">VIDEO</button>
      </div>
      <div class="row">
        <button class="thumb" id="btnGallery" aria-label="Open gallery"><img id="thumbImg" alt=""></button>
        <div class="shutter-wrap">
          <button class="shutter" id="btnShutter" aria-label="Take photo"><span></span></button>
        </div>
        <div class="side-right">
          <button class="round-btn" id="btnFlip" aria-label="Switch camera">
            <svg viewBox="0 0 24 24"><path d="M20 5h-3.17L15 3H9L7.17 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm-5 11.5V14H9v2.5L5.5 13 9 9.5V12h6V9.5l3.5 3.5-3.5 3.5Z"/></svg>
          </button>
          <button class="round-btn hidden" id="btnPause" aria-label="Pause recording">
            <svg viewBox="0 0 24 24"><path id="pausePath" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </button>
          <button class="round-btn hidden" id="btnSnap" aria-label="Capture photo while recording">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg>
          </button>
        </div>
      </div>
    </footer>

    <!-- Permission / error screen -->
    <section class="overlay-screen hidden" id="errorScreen">
      <div class="err-box">
        <svg viewBox="0 0 24 24"><path d="M21 6.5 17 10.5V7a1 1 0 0 0-1-1H9.82L21 17.18V6.5ZM3.27 2 2 3.27 4.73 6H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12c.21 0 .39-.08.55-.18L19.73 21 21 19.73 3.27 2Z"/></svg>
        <h2 id="errTitle">Camera unavailable</h2>
        <p id="errMsg"></p>
        <button class="primary" id="btnRetry">Try again</button>
      </div>
    </section>

    <!-- Settings sheet -->
    <section class="sheet hidden" id="settingsSheet">
      <div class="sheet-card">
        <div class="sheet-head"><h3>Settings</h3><button class="close" data-close>&times;</button></div>
        <label class="field"><span>Photo quality</span>
          <select id="setPhotoQ">
            <option value="max">Maximum (full sensor)</option>
            <option value="fast">Fast (preview frame)</option>
          </select>
        </label>
        <label class="field"><span>Video resolution</span>
          <select id="setVideoRes">
            <option value="720">HD 720p</option>
            <option value="1080" selected>Full HD 1080p</option>
            <option value="2160">UHD 4K</option>
          </select>
        </label>
        <label class="field"><span>Video frame rate</span>
          <select id="setFps">
            <option value="30" selected>30 fps</option>
            <option value="60">60 fps</option>
          </select>
        </label>
        <label class="field toggle"><span>Save selfies as previewed (mirrored)</span><input type="checkbox" id="setMirror" checked></label>
        <label class="field toggle"><span>Shutter sound</span><input type="checkbox" id="setSound" checked></label>
        <label class="field toggle"><span>Record audio in videos</span><input type="checkbox" id="setAudio" checked></label>
        <div class="caps" id="capsInfo"></div>
      </div>
    </section>

    <!-- Lens picker -->
    <section class="sheet hidden" id="lensSheet">
      <div class="sheet-card">
        <div class="sheet-head"><h3>Cameras on this phone</h3><button class="close" data-close>&times;</button></div>
        <p class="hint">Phones expose ultra-wide, main and telephoto lenses as separate cameras. Pick one directly if the zoom buttons don’t reach it.</p>
        <div class="lens-list" id="lensList"></div>
      </div>
    </section>

    <!-- Gallery -->
    <section class="gallery hidden" id="gallery">
      <header class="gal-head">
        <button class="icon-btn" id="btnGalBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2Z"/></svg></button>
        <h3>Gallery</h3>
        <span id="galCount"></span>
      </header>
      <div class="gal-grid" id="galGrid"></div>
      <p class="gal-empty hidden" id="galEmpty">No photos or videos yet.</p>
    </section>

    <!-- Viewer -->
    <section class="viewer hidden" id="viewer">
      <header class="gal-head">
        <button class="icon-btn" id="btnViewBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2Z"/></svg></button>
        <span id="viewInfo"></span>
      </header>
      <div class="view-body" id="viewBody"></div>
      <footer class="view-actions">
        <button id="btnShare"><svg viewBox="0 0 24 24"><path d="M18 16a3 3 0 0 0-2.4 1.2l-6.7-3.4a3 3 0 0 0 0-1.6l6.7-3.4A3 3 0 1 0 15 7c0 .3 0 .5.1.8L8.4 11.2a3 3 0 1 0 0 3.6l6.7 3.4A3 3 0 1 0 18 16Z"/></svg>Share</button>
        <button id="btnDownload"><svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2ZM19 9h-4V3H9v6H5l7 7 7-7Z"/></svg>Save</button>
        <button id="btnDelete"><svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12ZM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4Z"/></svg>Delete</button>
      </footer>
    </section>

    <div class="toast" id="toast"></div>
  </div>

  <canvas id="workCanvas" hidden></canvas>
  <script src="app.js"></script>
</body>
</html>
